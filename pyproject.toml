[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mixlab"
version = "0.0.1"
description = "Assistant de mixage pour exports FL Studio : mesures, masquage, corrections chiffrées"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mixlab = "mixlab.cli:main"

[tool.setuptools.packages.find]
include = ["mixlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
